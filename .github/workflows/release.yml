name: 发布插件和用户脚本

# 打 v* 标签时把插件 zip 和 .user.js 附到 GitHub Release。
# CI 只在推送分支时跑，推标签不会触发它，所以这里先自己跑一遍 lint / 类型检查 / 单元测试，红的就不发
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 整个工作流默认只读；只有发布那个 job 需要写 Release
permissions:
  contents: read

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  release:
    name: 构建并发布
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 检查版本号（标签 vX.Y.Z 必须和 package.json 一致，各包版本必须相同）
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          node - "$TAG" <<'EOF'
          const { readFileSync } = require('node:fs');
          const tag = process.argv[2];
          const files = ['package.json', 'apps/extension/package.json', 'apps/userscript/package.json', 'apps/web/package.json', 'apps/sync-worker/package.json', 'packages/core/package.json', 'packages/data/package.json'];
          const versions = new Map(files.map((f) => [f, JSON.parse(readFileSync(f, 'utf8')).version]));
          const distinct = [...new Set(versions.values())];
          if (distinct.length !== 1) {
            console.error('::error title=各包版本号不一致::' + [...versions].map(([f, v]) => `${f}=${v}`).join('，'));
            process.exit(1);
          }
          if (tag && tag !== `v${distinct[0]}`) {
            console.error(`::error title=标签和版本号不一致::标签是 ${tag}，package.json 里是 ${distinct[0]}。请先把所有 package.json 的 version 改成 ${tag.replace(/^v/, '')}，再重新打标签。`);
            process.exit(1);
          }
          console.log(`版本 ${distinct[0]}${tag ? `，标签 ${tag}` : ''}`);
          EOF
      - name: 构建
        env:
          SFF_RELEASE: '1'
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          export SFF_WEB_URL="${{ vars.SFF_WEB_URL || '' }}"
          [ -z "$SFF_WEB_URL" ] && export SFF_WEB_URL="https://${owner}.github.io/${{ github.event.repository.name }}/"
          # 和部署工作流一样：末尾统一带一个 /
          export SFF_WEB_URL="${SFF_WEB_URL%/}/"
          pnpm --filter @sff/extension build
          pnpm --filter @sff/userscript build
      - name: 生成校验和（下载后在同一目录运行 sha256sum -c SHA256SUMS 核对）
        run: |
          for f in apps/extension/dist/*.zip apps/userscript/dist/*.user.js; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
          done > SHA256SUMS
          cat SHA256SUMS
      # 第三方 action 钉死到提交 sha：标签可以被改指向，sha 不能。升级时把 sha 和后面的版本注释一起换
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/extension/dist/*.zip
            apps/userscript/dist/*.user.js
            SHA256SUMS
